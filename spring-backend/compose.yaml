name: mpos-spring
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mpos
      POSTGRES_USER: mpos
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpos -d mpos"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/mpos
      DATABASE_USER: mpos
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      MPOS_ADMIN_EMAIL: ${MPOS_ADMIN_EMAIL:?Set MPOS_ADMIN_EMAIL in .env}
      MPOS_ADMIN_PASSWORD: ${MPOS_ADMIN_PASSWORD:?Set MPOS_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
