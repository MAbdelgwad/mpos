spring:
  application:
    name: mpos-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mpos}
    username: ${DATABASE_USER:mpos}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 12MB
  jackson:
    property-naming-strategy: SNAKE_CASE
server:
  port: 8080
logging:
  pattern:
    level: "%5p [request_id=%X{requestId:-none}]"
mpos:
  bootstrap-email: ${MPOS_ADMIN_EMAIL:}
  bootstrap-password: ${MPOS_ADMIN_PASSWORD:}
